[project]
name = "kerykeion"
version = "6.0.0a92"
authors = [
    { name = "Giacomo Battaglia", email = "kerykeion.astrology@gmail.com" }
]
description = "A Python library for astrological calculations, including natal charts, houses, planetary aspects, and SVG chart generation."
license = { text = "AGPL-3.0" }
readme = "README.md"
keywords = [
    "astrology",
    "astrology library",
    "astrology calculations",
    "astrology calculator",
    "natal chart",
    "birth chart",
    "planetary aspects",
    "astrology transits",
    "houses of astrology",
    "ephemeris",
    "zodiac",
    "zodiac signs",
    "svg charts",
    "synastry",
    "astronomical algorithms"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Religion",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    # A FLOOR, not a pin (policy set at 3.0.0; see a62 vs a67-a78 history for
    # the precedent debate). An exact pin would make kerykeion
    # unco-installable with anything else depending on libephemeris.
    # The floor is 3.1.0 because kerykeion's UX depends on its two changes:
    # sealed leb mode no longer warns on fictitious-body dispatch (the
    # kerykeion#240 flood), and Uranian points always report
    # source="Analytical" (the retired uranians companion no longer flips
    # provenance by environment). The standing caveat remains: this
    # project's verification model is version-locked — golden fixtures track
    # the release the lockfile holds, and nothing asserts the installed
    # version at runtime. The lockfile protects this repository; it does not
    # protect `pip install kerykeion`.
    "libephemeris>=3.1.0,<4",
    "pydantic>=2.5",
    "svg-polish>=1.0.0",
    "requests-cache>=1.2.1",
    "requests>=2.33.0",
    "simple-ascii-tables>=1.0.0",
    # HARD runtime dependency, not a convenience: the stdlib `zoneinfo` searches
    # TZPATH (the HOST's tz database) first and falls back to this package only
    # when a zone is not found there. Without it, an image that ships no tz
    # database — Alpine, Windows, most slim containers — raises on every zone
    # lookup instead of casting a chart. It is a FLOOR, not a pin: where a system
    # database exists it still wins, so this does not by itself make two hosts
    # agree about a zone whose rules changed recently. Forcing agreement would
    # mean clearing TZPATH at import, which would silently override the tz
    # database an operator deliberately maintains.
    "tzdata>=2025.2",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
swiss = ["pyswisseph>=2.10.3.1"]
# The command-line interface. A FLOOR, not a pin (project policy): typer >=0.26
# vendorizes click, which removes a silent conflict — click 8.3 already enters
# the runtime graph as a transitive of libephemeris, so below 0.26 the CLI's
# correctness would depend on which click another dependency resolves. The .4
# patch is the settled point. rich shares the same floor family.
cli = ["typer>=0.26.4", "rich>=13.8.0"]
# ``all`` includes ``cli`` on purpose: a name that says "all" but omits an extra
# is a lie in the name. Self-referencing the other extras (PEP 508, supported by
# every resolver this project targets) keeps the version floors defined once —
# re-listing them here made the same pins live in three hand-synced places.
all = ["kerykeion[swiss]", "kerykeion[cli]"]

[project.scripts]
# The console command is installed for EVERY user — even ``pip install kerykeion``
# with no extras, because ``[project.scripts]`` is static metadata. ``main``
# serves a small stdlib-only core without the [cli] extra (``status``,
# ``--version``, ``--help``); every other subcommand prints an install hint and
# exits 3, so the bare command is useful out of the box and never crashes with a
# ModuleNotFoundError traceback.
kerykeion = "kerykeion.cli:main"

[project.urls]
Homepage = "https://www.kerykeion.net/"
Repository = "https://github.com/g-battaglia/kerykeion"
Documentation = "https://www.kerykeion.net/content/docs/"
Changelog = "https://github.com/g-battaglia/kerykeion/blob/alpha/v6/CHANGELOG.md"
Issues = "https://github.com/g-battaglia/kerykeion/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kerykeion"]

# Ship the third-party notices with the wheel: the templates embed glyph outlines
# derived from Noto Sans Symbols 2 and from Noto Sans (both SIL OFL 1.1), whose
# licenses must accompany them. Every file the NOTICE points at has to be here:
# the sdist gets them from its own "/licenses" include, so a repo checkout hides
# a missing entry and only a pip-installed tree shows the dangling reference.
[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "kerykeion/NOTICE"
"licenses/NotoSans-OFL.txt" = "kerykeion/licenses/NotoSans-OFL.txt"
"licenses/NotoSansSymbols2-OFL.txt" = "kerykeion/licenses/NotoSansSymbols2-OFL.txt"

[tool.hatch.build.targets.sdist]
include = [
    "/kerykeion",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/licenses",
    "/pyproject.toml",
]

# MyPy Static Analysis
[tool.mypy]
ignore_missing_imports = true
# No mypy_path: adding "kerykeion" here would also resolve `utilities`, `report`,
# `schemas` as top-level modules, masking imports written without the package prefix.
files = "kerykeion"

# PyTest Automated Testing
[tool.pytest.ini_options]
log_cli_level = 20
log_cli = true
testpaths = "tests"
log_level = 20
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
addopts = "-n auto --dist loadgroup"
markers = [
    "online: tests requiring network access (GeoNames API)",
    "core: hand-written essential tests with known values",
    "base: DE440s tier (1849-2150)",
    "medium: DE440 tier (1550-2650, cumulative)",
    "extended: DE441 tier (full range, cumulative)",
    "cli: command-line interface tests (requires the kerykeion[cli] extra)",
    "reference_backend_only: golden comparison the two ephemerides genuinely disagree on (deep antiquity); skipped off the baseline backend with a reason",
]

# Coverage Configuration
[tool.coverage.run]
source = ["kerykeion"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",

    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "Kerykeion Test Coverage Report"

# Task Runner
[tool.poe.tasks]

# ── Test suites (4 tiers: core < base < medium < extended) ──
[tool.poe.tasks."test:core"]
cmd = "pytest tests/core/ -m 'not online' --ignore=tests/core/test_houses_positions.py --ignore=tests/core/test_planetary_positions.py --ignore=tests/core/test_moon_phase_historical_verification.py --ignore=tests/core/test_subject_factory_parametrized.py --ignore=tests/core/test_chart_parametrized.py"
help = "Run core hand-written tests (fastest, default backend)"

[tool.poe.tasks."test:base"]
cmd = "pytest tests/ --tier=base -m 'not online'"
help = "Run base-tier tests (core + parametrized basics)"

[tool.poe.tasks."test:medium"]
cmd = "pytest tests/ --tier=medium -m 'not online'"
help = "Run medium-tier tests (base + house/planetary positions)"

[tool.poe.tasks."test:extended"]
cmd = "pytest tests/ -m 'not online'"
help = "Run extended-tier tests (all offline tests)"

[tool.poe.tasks."test:all"]
cmd = "pytest tests/ -m 'not online'"
help = "Run all tests (alias for test:extended)"

[tool.poe.tasks."test:all:cov"]
cmd = "pytest tests/ -m 'not online' --cov=kerykeion --cov-report=term-missing --cov-report=html"
help = "Run all tests with coverage report (terminal + htmlcov/)"

# ── Backend-specific test suites (identical tests, different ephemeris engine) ──
[tool.poe.tasks."test:lib"]
cmd = "pytest tests/core/ -m 'not online' --ignore=tests/core/test_backend_comparison.py --ignore=tests/core/test_houses_positions.py --ignore=tests/core/test_planetary_positions.py --ignore=tests/core/test_moon_phase_historical_verification.py --ignore=tests/core/test_subject_factory_parametrized.py --ignore=tests/core/test_chart_parametrized.py"
help = "Run core tests forced on libephemeris (KERYKEION_BACKEND=libephemeris)"
[tool.poe.tasks."test:lib".env]
KERYKEION_BACKEND = "libephemeris"

[tool.poe.tasks."test:swe"]
cmd = "pytest tests/core/ -m 'not online' --ignore=tests/core/test_backend_comparison.py --ignore=tests/core/test_houses_positions.py --ignore=tests/core/test_planetary_positions.py --ignore=tests/core/test_moon_phase_historical_verification.py --ignore=tests/core/test_subject_factory_parametrized.py --ignore=tests/core/test_chart_parametrized.py"
help = "Run core tests forced on swisseph (KERYKEION_BACKEND=swisseph)"
[tool.poe.tasks."test:swe".env]
KERYKEION_BACKEND = "swisseph"

[tool.poe.tasks."test:compare"]
cmd = "pytest tests/core/test_backend_comparison.py -v"
help = "Compare libephemeris vs swisseph (both must be installed via pip install kerykeion[all])"

# ── Command-line interface ──
[tool.poe.tasks."test:cli"]
cmd = "pytest tests/ -m 'cli and not online'"
help = "Run CLI tests (requires the kerykeion[cli] extra)"

[tool.poe.tasks."cli:smoke"]
cmd = "python scripts/cli_smoke_check.py"
help = "Smoke-check the kerykeion CLI entry point, --version, --help"

# ── Coverage ──
[tool.poe.tasks."test:core:cov"]
cmd = "pytest tests/core/ -m 'not online' --ignore=tests/core/test_houses_positions.py --ignore=tests/core/test_planetary_positions.py --ignore=tests/core/test_moon_phase_historical_verification.py --ignore=tests/core/test_subject_factory_parametrized.py --ignore=tests/core/test_chart_parametrized.py --cov --cov-report=term-missing --cov-report=html"
help = "Core tests with coverage report"

[tool.poe.tasks."test:base:cov"]
cmd = "pytest tests/ --tier=base -m 'not online' --cov --cov-report=term-missing --cov-report=html"
help = "Base-tier tests with coverage report"

[tool.poe.tasks."test:medium:cov"]
cmd = "pytest tests/ --tier=medium -m 'not online' --cov --cov-report=term-missing --cov-report=html"
help = "Medium-tier tests with coverage report"

[tool.poe.tasks."test:extended:cov"]
cmd = "pytest tests/ -m 'not online' --cov --cov-report=term-missing --cov-report=html"
help = "Extended-tier tests with coverage report"

# ── Code Quality ──
[tool.poe.tasks.lint]
cmd = "ruff check"
help = "Lint code with ruff"

[tool.poe.tasks.format]
cmd = "ruff format"
help = "Format code with ruff"

[tool.poe.tasks."format:all"]
cmd = "ruff format kerykeion tests"
help = "Format all code (kerykeion + tests)"

[tool.poe.tasks.analyze]
cmd = "mypy"
help = "Static type analysis with mypy"

[tool.poe.tasks.typecheck]
cmd = "pyright"
help = "Static type checking with pyright"

[tool.poe.tasks.imports]
cmd = "python scripts/check_import_graph.py --paths --patch-targets --loggers"
help = "Check module paths, patch targets and logger names outside kerykeion/"

[tool.poe.tasks."imports:fresh"]
cmd = "python scripts/check_import_graph.py --fresh-imports"
help = "Import every module in a cold interpreter (catches leaf-first cycles)"

[tool.poe.tasks."test:gates:extended"]
cmd = "pytest tests/core/test_every_baseline_has_a_reader.py tests/core/test_golden_charts_are_hermetic.py tests/core/test_baseline_freshness.py -p no:randomly"
help = "The baseline gates on the full-range kernel: on the default tier the reader gate cannot see a lost reader for the extended-tier subjects' baselines"

[tool.poe.tasks."test:gates:extended".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks.check]
sequence = ["lint", "analyze", "typecheck", "imports", "imports:fresh", "test:core", "test:gates:extended", "cli:smoke", "skill:cli:smoke"]
help = "Run all quality checks (lint, analyze, typecheck, test:core, the baseline gates on the extended kernel, cli:smoke, skill:cli:smoke)"

# cmd, not `script = "...:main"`: poethepoet 0.40.0 discards a script function's
# int return, so a `script` task exits 0 even when the checks fail — the gate
# would pass silently. Running the file propagates its `sys.exit(main())` code.
[tool.poe.tasks.quality]
cmd = "python scripts/quality_check.py"
help = "Run quality check script"

# Documentation
[tool.poe.tasks.docs]
cmd = "pdoc kerykeion -o ./docs"
help = "Generate API documentation"

[tool.poe.tasks."docs:check"]
cmd = "python scripts/check_documentation_coverage.py"
help = "Audit documentation coverage"

[tool.poe.tasks."docs:snippets"]
cmd = "python scripts/test_markdown_snippets.py"
help = "Test Python snippets in markdown files"

[tool.poe.tasks."docs:snippets:skill"]
cmd = "python scripts/test_markdown_snippets.py --skill"
help = "Test the agent skill's snippets standalone (no import prelude, no shared page context)"

# The CLI skill's examples are shell, which the python snippet runner ignores.
# Without this they would ship unverified into third-party repositories.
[tool.poe.tasks."skill:cli:smoke"]
cmd = "python scripts/test_skill_cli_snippets.py"
help = "Run every bash block in skills/kerykeion-cli against a sandboxed profile store"

# Regenerate Golden Standards — one command per category
[tool.poe.tasks."regenerate:glyph-widths"]
help = "Re-measure the info panel's glyph-width tables from the reference fonts (macOS only)"
cmd = "python scripts/regenerate_glyph_widths.py"

[tool.poe.tasks."regenerate:glyph-ink"]
help = "Re-measure modern wheel symbol ink extents in a browser and rewrite glyph_ink_metrics.py (interactive: opens a page)"
cmd = "python scripts/measure_modern_separation.py --mode dump-ink"

[tool.poe.tasks."regenerate:svg"]
sequence = ["regenerate:svg:base", "regenerate:svg:extended", "regenerate:svg:modern", "regenerate:svg:test-owned"]
help = "Regenerate all SVG chart baselines (tests/data/svg/)"

[tool.poe.tasks."regenerate:svg".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:svg:test-owned"]
cmd = "pytest tests/core/test_chart_drawer.py::TestProgressionChart tests/core/test_chart_drawer.py::TestNatalChart::test_minified_transit_chart tests/core/test_chart_drawer.py::TestNatalChart::test_minified_synastry_chart tests/core/test_bce_dates.py::TestBCEChartSVG::test_progression_chart_baseline tests/core/test_bce_dates.py::TestBCEChartSVG::test_synastry_chart_baseline tests/core/test_bce_dates.py::TestBCEChartSVG::test_transit_chart_baseline tests/core/test_bce_dates.py::TestBCEPairWithAModernPartner -p no:randomly -q"
help = "The eleven baselines no script casts — progressions, the minified pair, the BCE pairs — rewritten by the tests that own them"

[tool.poe.tasks."regenerate:svg:test-owned".env]
KERYKEION_REGEN_BASELINES = "1"
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:svg:base"]
cmd = "python scripts/regenerate_test_charts.py"

[tool.poe.tasks."regenerate:svg:extended"]
cmd = "python scripts/regenerate_test_charts_extended.py"

[tool.poe.tasks."regenerate:svg:modern"]
cmd = "python scripts/generate_modern_baselines.py"

# The three below produce committed SVGs too, and each had no task at all. That
# is why they went stale: `regenerate:all` did not reach them, so a template
# change refreshed tests/data/svg and left the README's own showcase images
# drawing a glyph set the library no longer had.
[tool.poe.tasks."regenerate:docs-charts"]
cmd = "python scripts/regenerate_docs_charts.py"
help = "Regenerate the documentation charts (docs/charts/) — the README's showcase images"

[tool.poe.tasks."regenerate:docs-charts".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:gallery-v6"]
cmd = "python scripts/generate_v6_test_gallery.py"
help = "Regenerate the v6 feature gallery (tests/data/v6_gallery/)"

[tool.poe.tasks."regenerate:gallery-v6".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:glyph-gallery"]
cmd = "python scripts/generate_glyph_gallery.py"
help = "Regenerate the published glyph poster and page (site/docs/chart-glyphs.md)"

[tool.poe.tasks.gallery]
cmd = "python scripts/generate_svg_validation_gallery.py"
help = "Render the whole SVG surface into svg_validation_gallery/ for visual review"

[tool.poe.tasks.gallery.env]
# Charts before ~1600 fall outside the default ephemeris tier and would be
# drawn as failure cards; the sweep deliberately includes them.
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks.playground]
cmd = "python scripts/generate_glyph_playground.py"
help = "Rebuild scripts/glyph_playground.html — the modern-cluster tuning page"

[tool.poe.tasks.playground.env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."gallery:index"]
cmd = "python scripts/generate_svg_validation_gallery.py --index-only"
help = "Rewrite the gallery page from cards.json, without re-rendering the charts"

[tool.poe.tasks."regenerate:reports"]
sequence = ["regenerate:reports:snapshots", "regenerate:reports:output"]
help = "Regenerate all report golden files (tests/fixtures/)"

[tool.poe.tasks."regenerate:reports".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:reports:snapshots"]
cmd = "python scripts/regenerate_report_snapshots.py"

[tool.poe.tasks."regenerate:reports:output"]
cmd = "python scripts/regenerate_test_output.py"

[tool.poe.tasks."regenerate:positions"]
cmd = "python scripts/regenerate_all.py --positions --subjects"
help = "Regenerate expected positions and subjects (tests/data/expected_positions.py, expected_astrological_subjects.py)"

[tool.poe.tasks."regenerate:positions".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:aspects"]
sequence = ["regenerate:aspects:natal", "regenerate:aspects:synastry"]
help = "Regenerate all expected aspects (tests/data/expected_*_aspects.py)"

[tool.poe.tasks."regenerate:aspects".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:aspects:natal"]
cmd = "python scripts/regenerate_expected_aspects.py"

[tool.poe.tasks."regenerate:aspects:synastry"]
cmd = "python scripts/regenerate_synastry_aspects.py"

[tool.poe.tasks."regenerate:configurations"]
cmd = "python scripts/regenerate_all.py --configurations"
help = "Regenerate all configuration-specific fixtures (house-systems, sidereal-modes, perspectives, returns, composite, ephemeris, arabic-parts)"

[tool.poe.tasks."regenerate:configurations".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks."regenerate:all"]
sequence = ["regenerate:svg", "regenerate:docs-charts", "regenerate:gallery-v6", "regenerate:glyph-gallery", "regenerate:reports", "regenerate:positions", "regenerate:aspects", "regenerate:configurations"]
help = "Regenerate all golden standards"
# Baselines must regenerate at the extended (DE441) tier so ancient/BCE subjects
# (year 100 AD, etc.) resolve on-disk instead of falling back, and so the long-range
# subjects aren't silently dropped (41 vs 32). Per memory baseline-regeneration-tier.
[tool.poe.tasks."regenerate:all".env]
LIBEPHEMERIS_PRECISION = "extended"

[tool.poe.tasks.benchmark]
cmd = "python scripts/benchmark.py"
help = "Run performance benchmarks (subject creation, aspects, SVG rendering)"

# Utilities
[tool.poe.tasks."build:smoke"]
shell = """
rm -rf dist && uv build &&
echo '== build:smoke env 1: wheel only (library chart + CLI install-hint guard) ==' &&
uv run --isolated --no-project --with dist/*.whl python scripts/build_smoke_check.py &&
uv run --isolated --no-project --with dist/*.whl python scripts/build_smoke_check_cli.py &&
echo '== build:smoke env 2: wheel + [cli] (CLI functional) ==' &&
uv run --isolated --no-project --with "typer>=0.26.4" --with "rich>=13.8.0" --with dist/*.whl python scripts/build_smoke_check_cli.py
"""
help = "Build sdist+wheel, then in ISOLATED envs verify: (env 1) the wheel imports and renders a chart and the bare kerykeion command degrades to the install hint; (env 2) with [cli], --version/--help work. Catches missing packaged data and a broken CLI guard before publishing."

[tool.poe.tasks.clean]
cmd = "rm -rf dist build *.egg-info htmlcov .coverage .coverage.* coverage.xml .pytest_cache .mypy_cache .ruff_cache"
help = "Clean build artifacts and caches"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable pyflakes (F) and pycodestyle (E, W) rules
select = [
    "F",      # Pyflakes - logic errors, undefined names, unused imports
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "INP",    # flake8-no-pep420 - a package dir missing __init__.py still imports
              # fine as a PEP 420 namespace package, so this is the only thing that
              # catches one that was forgotten. Scoped to kerykeion/ below.
]

# Ignore rules that conflict with project structure
ignore = [
    "E402",   # Module level import not at top of file (needed for some modules)
    "E501",   # Line too long (handled by line-length setting)
    "E731",   # Do not assign a lambda expression, use a def (stylistic choice)
]

[tool.ruff.lint.per-file-ignores]
# Settings re-exports symbols intentionally
"kerykeion/settings/__init__.py" = ["F401", "F403"]
# Schemas re-exports for public API
"kerykeion/schemas/__init__.py" = ["F401", "F403"]
# Utilities is a flat facade: it also re-exports semi-private names that other
# modules import, which by design stay out of __all__.
"kerykeion/utilities/__init__.py" = ["F401"]
# INP001 only guards the shipped package; these trees are scripts, not packages.
"scripts/*" = ["INP001"]
"examples/*" = ["INP001"]
"tests/*" = ["INP001"]
"workspace/*" = ["INP001"]

# Pyright Static Type Checking
# Pyright is configured in pyrightconfig.json, which takes precedence over a
# [tool.pyright] table here. Keeping both invites edits to the ignored copy.

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "fonttools>=4.50",  # used by scripts/build_chart_glyphs.py to extract glyph outlines
    "mypy>=1.17.1",
    "pdoc>=15.0.4",
    "poethepoet>=0.36.0",
    "pyright>=1.1.408",
    "pytest>=8.4.1",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.12.9",
    "types-requests>=2.32.4.20250611",
    "pyswisseph>=2.10.3.2",
    # CLI deps repeated in the dev group, NOT redundantly: pyrightconfig.json is
    # typeCheckingMode "basic" where reportMissingImports is an ERROR and the
    # include covers the whole ``kerykeion`` tree, so without typer/rich in the
    # venv ``poe typecheck`` fails for every contributor. mypy would not fail
    # (ignore_missing_imports = true) — it would just degrade the CLI to Any,
    # which is worse. Keep these floors aligned with the [cli] extra above.
    "typer>=0.26.4",
    "rich>=13.8.0",
]

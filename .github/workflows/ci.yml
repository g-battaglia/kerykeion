name: CI

on:
  push:
    branches: [main, "alpha/**", "beta/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy

      - name: Pyright
        run: uv run pyright

      - name: Public API documentation coverage
        run: uv run poe docs:check

      - name: Documentation snippets
        run: uv run poe docs:snippets

  test:
    name: Test (base tier, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # The libephemeris kernels are downloaded on first use; cache them so
      # subsequent runs don't re-fetch (~100 MB for the DE440s tier).
      - name: Cache ephemeris kernels
        uses: actions/cache@v4
        with:
          path: |
            ~/.libephemeris
            ~/.kerykeion/sweph
          key: ephemeris-${{ runner.os }}-de440s

      - name: Run base-tier tests (offline)
        run: uv run poe test:base

      - name: Build and smoke-test the wheel
        run: uv run poe build:smoke
